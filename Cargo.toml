[package]
name = "sweep"
version = "1.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }
rayon = "1.12.0"
self_update = { version = "1.3.3", default-features = false, features = ["github", "ureq", "rustls", "checksums", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
