# Pushing a tag like `v0.2.0` builds sweep for every platform
# and publishes the binaries on a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  check:
    name: Check version and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the Cargo.toml version ($version)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: check
    strategy:
      matrix:
        include:
          # musl gives a static binary that runs on any Linux distribution.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # crt-static embeds the C runtime: no Visual C++ redistributable needed.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: sweep-${{ github.ref_name }}-${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7

      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/sweep" config.example.toml "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:ARCHIVE
          Copy-Item "target/${{ matrix.target }}/release/sweep.exe", config.example.toml $env:ARCHIVE
          Compress-Archive $env:ARCHIVE "$env:ARCHIVE.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error

  publish:
    name: Publish the release
    # Runs only when every build succeeded: a release is never half published.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes
